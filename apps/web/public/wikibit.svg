<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4B0"/>
      <stop offset="0.3" stop-color="#F4BE34"/>
      <stop offset="0.6" stop-color="#E0921A"/>
      <stop offset="0.85" stop-color="#F7CD4E"/>
      <stop offset="1" stop-color="#C47A12"/>
    </linearGradient>
    <linearGradient id="rimBevel" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFE48A"/>
      <stop offset="1" stop-color="#C47A12"/>
    </linearGradient>
    <radialGradient id="field" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#3B3A8F"/>
      <stop offset="0.55" stop-color="#2C2A6E"/>
      <stop offset="1" stop-color="#1A2C66"/>
    </radialGradient>
    <linearGradient id="piece" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7C2"/>
      <stop offset="0.35" stop-color="#FFD24A"/>
      <stop offset="0.7" stop-color="#F2A81E"/>
      <stop offset="1" stop-color="#E08E14"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A9C8FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#A9C8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#FFF2A8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FFD54A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="puzzle" x="16" y="16" width="40" height="40" patternUnits="userSpaceOnUse">
      <path transform="scale(0.3333)" d="M14 16 H50 C48 6 53 2 60 2 C67 2 72 6 70 16 H110 V52 C104 50 98 54 98 60 C98 66 104 70 110 68 V112 H14 V70 C24 72 28 66 28 60 C28 54 24 48 14 50 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.11" stroke-width="5" stroke-linejoin="round"/>
    </pattern>
    <clipPath id="fieldClip"><circle cx="256" cy="256" r="178"/></clipPath>
    <path id="pz" d="M180 180 H236 C228 156 240 144 256 144 C272 144 284 156 276 180 H332 V236 C356 228 368 240 368 256 C368 272 356 284 332 276 V332 H276 C284 356 272 368 256 368 C240 368 228 356 236 332 H180 V276 C156 284 144 272 144 256 C144 240 156 228 180 236 Z"/>
    <path id="W" d="M118 160 H214 V182 L196 184 L226 288 L246 214 H266 L286 288 L316 184 L298 182 V160 H394 V182 L378 186 L322 352 H290 L256 262 L222 352 H190 L134 186 L118 182Z"/>
    <symbol id="spark" viewBox="-10 -10 20 20">
      <circle r="9" fill="url(#glow)" opacity="0.75"/>
      <path d="M0-10 Q1.2-1.2 10 0 Q1.2 1.2 0 10 Q-1.2 1.2 -10 0 Q-1.2-1.2 0-10Z" fill="#FFFBE0"/>
    </symbol>
  </defs>

  <!-- Tranche cannelée (concentrique) -->
  <circle cx="256" cy="256" r="244" fill="#C47A12"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#F2B53A" stroke-width="7" stroke-dasharray="3 4"/>

  <!-- Bord doré -->
  <circle cx="256" cy="256" r="234" fill="url(#rim)" stroke="#A65A08" stroke-width="3"/>
  <circle cx="256" cy="256" r="207" fill="none" stroke="#B8670C" stroke-width="5" stroke-dasharray="0 15.2" stroke-linecap="round" opacity="0.7"/>
  <circle cx="256" cy="256" r="193" fill="url(#rimBevel)" stroke="#B8670C" stroke-width="2"/>

  <!-- Champ émaillé bleu nuit -->
  <circle cx="256" cy="256" r="182" fill="#A9C8FF"/>
  <circle cx="256" cy="256" r="178" fill="url(#field)"/>
  <g clip-path="url(#fieldClip)">
    <rect x="70" y="70" width="372" height="372" fill="url(#puzzle)"/>
    <circle cx="256" cy="256" r="160" fill="url(#halo)"/>
  </g>

  <!-- Losanges bleu clair sur le bord -->
  <g fill="#A9C8FF" stroke="#2C2A6E" stroke-width="2" stroke-linejoin="round">
    <path d="M256 30 L266 43 L256 56 L246 43Z"/>
    <path d="M256 456 L266 469 L256 482 L246 469Z"/>
    <path d="M30 256 L43 246 L56 256 L43 266Z"/>
    <path d="M456 256 L469 246 L482 256 L469 266Z"/>
  </g>

  <!-- Pièce de puzzle dorée, centrée -->
  <g stroke-linejoin="round">
    <use href="#pz" transform="translate(0 6)" fill="#D9870F"/>
    <use href="#pz" fill="url(#piece)" stroke="#B8670C" stroke-width="3"/>
    <path d="M186 186 H230 M282 186 H326 M186 190 V230 M186 282 V326" stroke="#FFFBDD" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <path d="M326 282 V326 H282" fill="none" stroke="#E8A030" stroke-width="3" stroke-linecap="round"/>

    <!-- W gravé -->
    <g transform="translate(256 256) scale(0.46) translate(-256 -256)">
      <use href="#W" transform="translate(4 5)" fill="#FFF6C4"/>
      <use href="#W" transform="translate(-3 -3)" fill="#C47A12"/>
      <use href="#W" fill="#EBA224"/>
    </g>
  </g>

  <!-- Éclats -->
  <use href="#spark" x="70" y="78" width="70" height="70"/>
  <use href="#spark" x="390" y="370" width="54" height="54"/>
  <use href="#spark" x="406" y="96" width="24" height="24"/>
</svg>
